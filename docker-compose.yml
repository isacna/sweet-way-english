services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sweetway}
      POSTGRES_USER: ${POSTGRES_USER:-sweetway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Sem porta publicada: só o backend acessa o banco. Para usar um cliente local, descomente:
    # ports:
    #   - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    ports:
      - "3333:3333"
    environment:
      # Monta a URL a partir de POSTGRES_*; defina DATABASE_URL no .env para usar outro banco.
      # Se a senha tiver caracteres especiais (@ : / ? #), escreva-a com URL encoding.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-sweetway}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sweetway}}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env (pelo menos 16 caracteres)}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      APP_URL: ${APP_URL:-http://localhost:3333}
      # production por padrão: o seed não cria as contas de demonstração (senha123) sem SEED_DEMO=1
      NODE_ENV: ${NODE_ENV:-production}
      # Proxies reversos na frente da API (Caddy = 1); 0 quando a porta 3333 é acessada direto
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # Seed só roda com SEED_ON_START=1 (ex.: na primeira subida); veja backend/prisma/seed.ts
      SEED_ON_START: ${SEED_ON_START:-0}
      SEED_DEMO: ${SEED_DEMO:-}
      SEED_PUBLICAR_CONTEUDO: ${SEED_PUBLICAR_CONTEUDO:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_SENHA: ${ADMIN_SENHA:-}
      ADMIN_NOME: ${ADMIN_NOME:-}
    # Só volumes de dados. Nunca monte nada sobre /app/prisma: schema, migrações e conteúdo vêm da imagem.
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3333/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3333}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3333}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  uploads_data:
