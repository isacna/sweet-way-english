services:
  backend:
    build:
      context: ./backend
    ports:
      - "3333:3333"
    environment:
      DATABASE_URL: file:./prisma/data.db
      JWT_SECRET: ${JWT_SECRET:-sweet-way-secret-key}
      APP_URL: ${APP_URL:-http://localhost:3333}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - db_data:/app/prisma
      - uploads_data:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3333/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3333}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3333}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
  uploads_data:
